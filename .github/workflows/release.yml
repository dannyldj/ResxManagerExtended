name: Release

on:
  pull_request:
    branches:
      - master
    types: [ closed ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true && startsWith(github.head_ref || github.ref_name, 'release/')
    env:
      BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Set tag environment
        run: echo "TAG=${BRANCH_NAME##*/}" >> $GITHUB_ENV

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish
        run: dotnet publish ResxManagerExtended.Desktop/ResxManagerExtended.Desktop.csproj -r:win-x86 -c:Release -o:publish -p:PublishSingleFile=true -p:EnableWindowsTargeting=true

      - name: Make compressed file from Publish
        run: tar -cvf "rmx.${TAG}.portable.tar" publish

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --target "$TARGET" \
            --generate-notes \
            --prerelease \
            "rmx.${TAG}.portable.tar"
